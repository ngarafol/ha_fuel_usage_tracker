add_fillup:
  name: Add fill-up
  description: Record a refuelling event for a vehicle.
  fields:
    vehicle:
      name: Vehicle
      description: Config entry id or vehicle name.
      required: true
      example: My car
      selector:
        text:
    liters:
      name: Liters
      description: Amount of fuel added, in liters. Must be greater than 0.
      required: true
      example: 42.5
      selector:
        number:
          min: 0.001
          step: 0.001
          unit_of_measurement: L
    price:
      name: Total price
      description: Total amount paid for this fill-up.
      required: true
      example: 65.3
      selector:
        number:
          min: 0
          step: 0.01
    odometer:
      name: Odometer
      description: Odometer reading after this fill-up, in km. Optional.
      required: false
      example: 123456
      selector:
        number:
          min: 0
          step: any
          unit_of_measurement: km
    date:
      name: Date and time
      description: When the fill-up happened. Defaults to the current date and time.
      required: false
      selector:
        datetime:
    full:
      name: Full tank
      description: Whether the tank was filled to full. Consumption is only computed between full tanks.
      required: false
      default: true
      selector:
        boolean:
    station:
      name: Station
      description: Name of the filling station.
      required: false
      example: INA Savska
      selector:
        text:
    notes:
      name: Notes
      description: Free text notes about this fill-up.
      required: false
      selector:
        text:
          multiline: true
delete_fillup:
  name: Delete fill-up
  description: Delete a recorded fill-up from a vehicle. This cannot be undone.
  fields:
    vehicle:
      name: Vehicle
      description: Config entry id or vehicle name.
      required: true
      example: My car
      selector:
        text:
    fillup_id:
      name: Fill-up id
      description: Id of the fill-up to delete, as exposed by the last fill-up sensor.
      required: true
      example: 4f7c0f2a1b9d4a6e8c3f5d2b7a1e9c40
      selector:
        text:

update_vehicle:
  name: Update vehicle
  description: Change the settings of a tracked vehicle.
  fields:
    vehicle:
      name: Vehicle
      description: Config entry id or vehicle name.
      required: true
      example: My car
      selector:
        text:
    name:
      name: Vehicle name
      description: New vehicle name, also used as the config entry title.
      required: false
      example: My car
      selector:
        text:
    fuel_type:
      name: Fuel type
      description: Fuel the vehicle runs on.
      required: false
      selector:
        select:
          translation_key: fuel_type
          options:
            - petrol
            - diesel
            - lpg
            - cng
            - hybrid
            - electric
            - other
    engine:
      name: Engine
      description: Free text engine description, for example "1.6 TDI".
      required: false
      example: 1.6 TDI
      selector:
        text:
    odometer:
      name: Baseline odometer
      description: Odometer reading when tracking started, in km.
      required: false
      example: 120000
      selector:
        number:
          min: 0
          step: any
          unit_of_measurement: km
