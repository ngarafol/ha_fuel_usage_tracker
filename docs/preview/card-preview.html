<!doctype html>
<!--
  Fuel Usage Tracker card preview — standalone harness, no Home Assistant needed.

  Loads the real card file relatively, fakes just enough of the `hass` object
  (states from a real HA 2026.2.3 export, formatNumber via Intl, callService as a
  resolved no-op) and mimics the HA theme + `ha-card` element so the screenshot
  looks like a real dashboard card.

  Regenerate the screenshots (from the repo root). A writable HOME plus a fresh
  --user-data-dir and --crash-dumps-dir per run keep Chrome healthy: on a machine
  where crashpad cannot write its dump it still writes the PNG but exits 2, so
  trust the "bytes written to file" line (and the PNG) over the exit status.
  --run-all-compositor-stages-before-draw is NOT optional: without it the capture
  races the compositor and about half the shots get a 2 px grey band stamped on
  the last rows of the image (clean 6/6 runs with it, 3/8 without).

  The window is 560x1700: with the "Monthly comparison" table the card renders
  1603 CSS px tall and the page 1635 px, so 560x1200 would cut the last two
  monthly rows off. Re-measure (data-card-height on <html>) when the card grows.

  CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
  cd <repo root>
  mkdir -p /tmp/fut_home /tmp/fut_crashes
  HOME=/tmp/fut_home TMPDIR=/tmp "$CHROME" --headless=new --no-sandbox --disable-gpu \
    --disable-dev-shm-usage --disable-crash-reporter --crash-dumps-dir=/tmp/fut_crashes \
    --run-all-compositor-stages-before-draw --hide-scrollbars --force-device-scale-factor=2 \
    --virtual-time-budget=3000 --window-size=560,1700 --user-data-dir=/tmp/fut_shot_light \
    --screenshot=docs/images/card-light.png "file://$PWD/docs/preview/card-preview.html"
  HOME=/tmp/fut_home TMPDIR=/tmp "$CHROME" --headless=new --no-sandbox --disable-gpu \
    --disable-dev-shm-usage --disable-crash-reporter --crash-dumps-dir=/tmp/fut_crashes \
    --run-all-compositor-stages-before-draw --hide-scrollbars --force-device-scale-factor=2 \
    --virtual-time-budget=3000 --window-size=560,1700 --user-data-dir=/tmp/fut_shot_dark \
    --screenshot=docs/images/card-dark.png "file://$PWD/docs/preview/card-preview.html?theme=dark"

  Check the result: every pixel row below the card must be page background
  (light #fafafa / dark #111111); if the image touches its bottom edge with grey
  pixels, re-run that one.

  Whole-card height is exposed as data-card-height on <html> (check with --dump-dom).
-->

<script>
  // --- minimal stand-ins for the two HA frontend pieces the card depends on ---

  // <ha-card>: in real HA this is a styled custom element with its own shadow
  // root; the card only adds `overflow: hidden` to it.
  if (!customElements.get("ha-card")) {
    customElements.define("ha-card", class extends HTMLElement {
      constructor() {
        super();
        const root = this.attachShadow({ mode: "open" });
        root.innerHTML = `<style>
          :host {
            display: block;
            background: var(--ha-card-background, var(--card-background-color, #fff));
            border: var(--ha-card-border-width, 1px) solid
              var(--ha-card-border-color, var(--divider-color));
            border-radius: var(--ha-card-border-radius, 12px);
            box-shadow: var(--ha-card-box-shadow, none);
            color: var(--primary-text-color);
          }
        </style><slot></slot>`;
      }
    });
  }

  const data = JSON.parse(document.getElementById("states").textContent);
  const locale = { language: "hr-HR", number_format: "language" };
  const language = locale.language;

  const states = {};
  for (const state of data.states) states[state.entity_id] = state;

  const hass = {
    states,
    language,
    locale,
    config: {
      currency: "EUR",
      unit_system: { length: "km", volume: "L" },
    },
    // HA's real helper honours the configured locale; Intl is the same maths.
    formatNumber(value, options) {
      return new Intl.NumberFormat(locale.language, options).format(value);
    },
    callService() {
      return Promise.resolve();
    },
  };

  const card = document.createElement("fuelusagetracker-card");
  document.body.append(card);
  card.hass = hass;

  // Diagnostics for the screenshot step: whole-card pixel height.
  document.documentElement.setAttribute("data-card-height", String(document.body.scrollHeight));
</script>
